<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>역발상 공유 캘린더</title>
    <!-- Tailwind CSS 및 구글 머티리얼 아이콘 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client SDK 공식 CDN 로드 (HTML 싱글 파일에서 직접 백엔드 연동 지원) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Google Sans Flex', sans-serif;

</head>
<body class="text-gray-100 min-h-screen flex flex-col">

    <div class="flex-grow flex flex-col max-w-4xl w-full mx-auto p-4 md:p-6">
        
        <header class="mb-6 flex justify-between items-center border-b border-gray-800 pb-4">
            <div class="flex items-center gap-2">
                <span class="material-icons text-indigo-500 text-3xl">event_busy</span>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Inverse Calendar</h1>
                    <p class="text-xs text-gray-400">안 되는 날을 빼버리는 초간단 일정 조율</p>
                </div>
            </div>
            <!-- 내 접속 정보 표시 영역 -->
            <div id="user-info" class="hidden text-xs bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-full flex items-center gap-2">
                <span id="conn-badge" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
                <span id="current-user-display" class="font-semibold text-gray-300">사용자</span>
            </div>
        </header>

        <main id="view-landing" class="flex-grow flex flex-col justify-center max-w-md w-full mx-auto py-6">
            <div class="bg-gray-950 border border-gray-800 rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
                <div class="text-center space-y-2">
                    <div class="inline-flex p-3 bg-indigo-950/40 rounded-2xl border border-indigo-900/30 text-indigo-400 mb-2">
                        <span class="material-icons text-3xl">group_add</span>
                    </div>
                    <h2 class="text-2xl font-bold text-white">친구와 공유 캘린더 시작하기</h2>
                    <p class="text-sm text-gray-400">로그인 없이 이름과 코드로 즉시 시작하세요.</p>
                </div>

                <!-- 이름 입력 (필수) -->
                <div class="space-y-2">
                    <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">내 이름 (닉네임)</label>
                    <input type="text" id="input-nickname" placeholder="예: 길동이, 철수" 
                           class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                </div>

                <div class="border-t border-gray-800/60 my-4"></div>

                <!-- 방 생성 / 참가 선택 탭 -->
                <div class="grid grid-cols-2 gap-2 p-1 bg-gray-900 rounded-xl border border-gray-800/80">
                    <button id="tab-join" class="py-2.5 text-sm font-semibold rounded-lg bg-gray-800 text-white shadow-sm transition">
                        초대코드로 참가

                    <button id="tab-create" class="py-2.5 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition">
                        새로운 방 만들기
                    </button>
                </div>

                <!-- 참가 폼 (SELECT 검증 로직 연결 예정) -->
                <div id="form-join" class="space-y-4">
                    <div class="space-y-2">
                        <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">6자리 초대 코드</label>
                        <input type="text" id="input-room-code" placeholder="예: WINE26" maxlength="6"
                               class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm font-mono tracking-widest text-center uppercase text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                    </div>
                    <button id="btn-submit-join" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-600/10 flex items-center justify-center gap-2">
                        <span class="material-icons text-sm">login</span>
                        방 입장하기
                    </button>
                </div>

                <!-- 생성 폼 (INSERT 전송 로직 연결 예정) -->
                <div id="form-create" class="space-y-4 hidden">
                    <div class="space-y-2">
                        <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">방 이름 (모임 이름)</label>
                        <input type="text" id="input-room-name" placeholder="예: 동창회 여름 휴가 조율" 
                               class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                    </div>
                    <button id="btn-submit-create" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-emerald-600/10 flex items-center justify-center gap-2">
                        <span class="material-icons text-sm">add_circle</span>
                        방 생성 후 입장
                    </button>
                </div>
            </div>
        </main>

        <main id="view-calendar" class="flex-grow flex flex-col md:flex-row gap-6 hidden">
            
            <!-- 왼쪽: 실제 인터랙티브 캘린더 영역 -->
            <div class="flex-1 bg-gray-950 border border-gray-800 rounded-2xl p-5 md:p-6 shadow-xl flex flex-col">
                <!-- 달력 컨트롤러 헤더 -->
                <div class="flex justify-between items-center mb-6">
                    <div class="space-y-1">
                        <h2 id="calendar-room-title" class="text-lg font-bold text-white">로딩 중...</h2>
                        <!-- 복사 가능한 초대 코드 뱃지 -->
                        <div id="copy-code-container" class="inline-flex items-center gap-1.5 bg-gray-900 hover:bg-gray-800 border border-gray-800 px-2.5 py-1 rounded-lg text-xs font-mono text-indigo-400 cursor-pointer transition">
                            <span>CODE:</span>
                            <span id="calendar-room-code" class="font-bold">------</span>
                            <span class="material-icons text-xs">content_copy</span>
                        </div>
                    </div>
                    <!-- 월 변경 컨트롤 -->
                    <div class="flex items-center gap-1.5 bg-gray-900 border border-gray-800 p-1 rounded-xl">
                        <button id="btn-prev-month" class="p-1.5 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-white transition">
                            <span class="material-icons text-sm">chevron_left</span>
                        </button>
                        <span id="calendar-year-month" class="text-xs font-bold text-gray-300 px-1 select-none">----. --</span>
                        <button id="btn-next-month" class="p-1.5 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-white transition">
                            <span class="material-icons text-sm">chevron_right</span>
                        </button>
                    </div>
                </div>

                <!-- 요일 라벨 헤더 -->
                <div class="grid grid-cols-7 gap-2 text-center text-xs font-bold text-gray-500 mb-3 border-b border-gray-900 pb-2">
                    <div class="text-red-500/80">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-500/80">토</div>
                </div>

                <!-- 동적 캘린더 격자판 -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-2 flex-grow aspect-square md:aspect-auto">
                    <!-- 자바스크립트로 요일과 날짜들이 실시간 생성됨 -->
                </div>

                <!-- 달력 하단 상태 가이드 안내 -->
                <div class="mt-4 pt-4 border-t border-gray-900 flex flex-wrap gap-4 text-xs">
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-md bg-[#132d21] border border-[#22c55e]/30"></span>
                        <span class="text-gray-400 font-medium">✅ 모두 가능</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-md bg-[#2d1b11] border border-[#f59e0b]/30"></span>
                        <span class="text-gray-400 font-medium">⚠️ 1명 불가</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-md bg-[#2d1111] border border-[#ef4444]/30"></span>
                        <span class="text-gray-400 font-medium">❌ 2명 이상 불가</span>
                    </div>
                </div>
            </div>

            <div class="w-full md:w-80 space-y-4">
                
                <!-- 참가자 목록 보드 -->
                <div class="bg-gray-950 border border-gray-800 rounded-2xl p-5 shadow-xl">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3 flex items-center gap-1.5">
                        <span class="material-icons text-sm text-indigo-400">people</span>
                        현재 참가한 친구들
                    </h3>
                    <div id="participants-list" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                        <!-- 친구들 이름이 주입됨 -->
                    </div>
                </div>

                <div class="bg-gray-950 border border-emerald-900/40 rounded-2xl p-5 shadow-xl">
                    <div class="flex items-center justify-between gap-3">
                        <div class="flex items-center gap-2 min-w-0">
                            <span id="realtime-badge" class="w-2.5 h-2.5 shrink-0 rounded-full bg-yellow-500 animate-pulse"></span>
                            <div class="min-w-0">
                                <h3 class="text-xs font-bold text-gray-200">실시간 동기화</h3>
                                <p id="realtime-status" class="text-[10px] text-gray-400">연결 준비 중</p>
                            </div>
                        </div>
                        <button id="btn-refresh-calendar" type="button"
                                class="shrink-0 p-2 rounded-lg border border-gray-800 bg-gray-900 text-gray-400 hover:text-white hover:bg-gray-800 transition"
                                title="일정 새로고침" aria-label="일정 새로고침">
                            <span class="material-icons text-base">refresh</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 토스트 피드백 메시지 시스템 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 border border-gray-800 text-white px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 transform translate-y-24 opacity-0 transition-all duration-300 z-50">
        <span class="material-icons text-indigo-400 text-sm" id="toast-icon">info</span>
        <span class="text-xs font-semibold" id="toast-message">알림 메시지</span>
    </div>


    <script>
        const SUPABASE_URL = 'https://bukgcsoifruzxyycbvzi.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_qUPnfXni_qOdCzBA7kaeRA_n7NWLv4b';
        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const AppState = {
            currentView: 'landing',
            user: {
                nickname: localStorage.getItem('inverse_calendar_nick') || '',
                roomCode: ''
            },
            calendar: {
                year: new Date().getFullYear(),
                month: new Date().getMonth()
            },
            loadedSchedules: [],
            realtimeChannel: null,
            realtimePauseTimer: null,
            realtimeSequence: 0,
            pendingDates: new Set()
        };

        const Database = {
            generateRoomCode() {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                let code = '';
                for (let i = 0; i < 6; i += 1) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return code;
            },

            async getRoom(code) {
                const { data, error } = await supabaseClient
                    .from('rooms')
                    .select('room_code, room_name')
                    .eq('room_code', code.trim().toUpperCase())
                    .maybeSingle();

                if (error) throw error;
                return data;
            },

            async createRoom(name) {
                for (let attempt = 0; attempt < 5; attempt += 1) {
                    const roomCode = this.generateRoomCode();
                    const { data, error } = await supabaseClient
                        .from('rooms')
                        .insert({ room_code: roomCode, room_name: name })
                        .select('room_code, room_name')
                        .single();

                    if (!error) return data;
                    if (error.code !== '23505') throw error;
                }
                throw new Error('방 코드 생성이 반복해서 충돌했습니다.');
            },

            async getSchedules(roomCode) {
                const { data, error } = await supabaseClient
                    .from('schedules')
                    .select('id, room_code, user_name, impossible_date, is_impossible')
                    .eq('room_code', roomCode)
                    .eq('is_impossible', true)
                    .order('impossible_date', { ascending: true });

                if (error) throw error;
                return data || [];
            },

            async toggleSchedule(roomCode, userName, dateStr) {
                const { data: existing, error: selectError } = await supabaseClient
                    .from('schedules')
                    .select('id, is_impossible')
                    .eq('room_code', roomCode)
                    .eq('user_name', userName)
                    .eq('impossible_date', dateStr)
                    .limit(1)
                    .maybeSingle();

                if (selectError) throw selectError;

                if (existing) {
                    const { error } = await supabaseClient
                        .from('schedules')
                        .update({ is_impossible: !existing.is_impossible })
                        .eq('id', existing.id);
                    if (error) throw error;
                    return;
                }

                const { error } = await supabaseClient
                    .from('schedules')
                    .insert({
                        room_code: roomCode,
                        user_name: userName,
                        impossible_date: dateStr,
                        is_impossible: true
                    });
                if (error) throw error;
            }
        };

        function showToast(message, icon = 'info') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            document.getElementById('toast-icon').innerText = icon;

            toast.classList.remove('opacity-0', 'translate-y-24');
            toast.classList.add('opacity-100', 'translate-y-0');

            window.clearTimeout(showToast.timer);
            showToast.timer = window.setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-24');
            }, 3000);
        }

        function setRealtimeStatus(status) {
            const badge = document.getElementById('realtime-badge');
            const label = document.getElementById('realtime-status');
            const headerBadge = document.getElementById('conn-badge');
            if (!badge || !label) return;

            const states = {
                SUBSCRIBED: ['bg-emerald-500', '실시간 연결됨'],
                CHANNEL_ERROR: ['bg-red-500', '실시간 연결 오류'],
                TIMED_OUT: ['bg-amber-500', '실시간 연결 지연'],
                CLOSED: ['bg-gray-500', '실시간 연결 종료'],
                PAUSED: ['bg-gray-500', '백그라운드에서 일시 중지']
            };
            const [color, text] = states[status] || ['bg-yellow-500', '실시간 연결 중'];

            badge.className = `w-2.5 h-2.5 rounded-full ${color} animate-pulse`;
            headerBadge.className = `w-2 h-2 rounded-full ${color} animate-pulse`;
            label.innerText = text;
        }

        function storeUserSession(nickname, roomCode) {
            localStorage.setItem('inverse_calendar_nick', nickname);
            AppState.user.nickname = nickname;
            AppState.user.roomCode = roomCode;
            document.getElementById('current-user-display').innerText = `${nickname} (참여 중)`;
            document.getElementById('user-info').classList.remove('hidden');
        }

        function switchView(viewName) {
            AppState.currentView = viewName;
            const isLanding = viewName === 'landing';
            document.getElementById('view-landing').classList.toggle('hidden', !isLanding);
            document.getElementById('view-calendar').classList.toggle('hidden', isLanding);
            if (isLanding) {
                document.getElementById('user-info').classList.add('hidden');
            }
        }

        async function fetchAndRenderAll(options = {}) {
            if (!AppState.user.roomCode) return;
            try {
                AppState.loadedSchedules = await Database.getSchedules(AppState.user.roomCode);
                renderCalendar();
                renderParticipants();
            } catch (error) {
                console.error('일정 조회 실패:', error);
                if (!options.silent) {
                    showToast('일정을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.', 'error');
                }
            }
        }

        function clearRealtimePauseTimer() {
            window.clearTimeout(AppState.realtimePauseTimer);
            AppState.realtimePauseTimer = null;
        }

        async function stopRealtime(status = 'CLOSED') {
            clearRealtimePauseTimer();
            AppState.realtimeSequence += 1;
            const channel = AppState.realtimeChannel;
            AppState.realtimeChannel = null;
            if (channel) {
                await supabaseClient.removeChannel(channel);
            }
            if (status) setRealtimeStatus(status);
        }

        async function subscribeToRoom() {
            if (
                !AppState.user.roomCode ||
                AppState.currentView !== 'calendar' ||
                document.hidden
            ) return;

            clearRealtimePauseTimer();
            const sequence = AppState.realtimeSequence + 1;
            AppState.realtimeSequence = sequence;
            const roomCode = AppState.user.roomCode;
            const previousChannel = AppState.realtimeChannel;
            AppState.realtimeChannel = null;

            if (previousChannel) {
                await supabaseClient.removeChannel(previousChannel);
            }
            if (
                sequence !== AppState.realtimeSequence ||
                roomCode !== AppState.user.roomCode ||
                document.hidden
            ) return;

            const channel = supabaseClient
                .channel(`shared-calendar-${roomCode}`)
                .on(
                    'postgres_changes',
                    {
                        event: '*',
                        schema: 'public',
                        table: 'schedules',
                        filter: `room_code=eq.${roomCode}`
                    },
                    () => fetchAndRenderAll({ silent: true })
                )
                .subscribe((status) => {
                    if (AppState.realtimeChannel === channel) {
                        setRealtimeStatus(status);
                    }
                });

            AppState.realtimeChannel = channel;
        }

        function scheduleRealtimePause() {
            clearRealtimePauseTimer();
            AppState.realtimePauseTimer = window.setTimeout(() => {
                if (document.hidden && AppState.realtimeChannel) {
                    stopRealtime('PAUSED').catch((error) => {
                        console.error('실시간 연결 중지 실패:', error);
                    });
                }
            }, 60000);
        }

        async function resumeRealtime() {
            clearRealtimePauseTimer();
            if (
                document.hidden ||
                !AppState.user.roomCode ||
                AppState.currentView !== 'calendar'
            ) return;

            await fetchAndRenderAll({ silent: true });
            if (!AppState.realtimeChannel) {
                await subscribeToRoom();
            }
        }

        async function enterRoom(room, nickname) {
            storeUserSession(nickname, room.room_code);
            document.getElementById('calendar-room-title').innerText = room.room_name;
            document.getElementById('calendar-room-code').innerText = room.room_code;
            switchView('calendar');
            await fetchAndRenderAll();
            await subscribeToRoom();
        }

        function getYearMonthString(year, month) {
            return `${year}. ${(month + 1).toString().padStart(2, '0')}`;
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const { year, month } = AppState.calendar;
            const startDayOfWeek = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < startDayOfWeek; i += 1) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'bg-gray-900/10 rounded-xl border border-transparent select-none';
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day += 1) {
                const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const busyPeople = [...new Set(
                    AppState.loadedSchedules
                        .filter((schedule) => schedule.impossible_date === dateString)
                        .map((schedule) => schedule.user_name)
                )];

                const cell = document.createElement('button');
                cell.type = 'button';
                cell.dataset.date = dateString;
                cell.className = 'relative aspect-square flex flex-col justify-between p-2 rounded-xl cursor-pointer transition select-none group text-left hover:z-50 focus-visible:z-50 ';

                if (busyPeople.length === 0) {
                    cell.className += 'bg-[#0f241a] border border-green-900/30 text-green-400 hover:bg-[#143224]';
                } else if (busyPeople.length === 1) {
                    cell.className += 'bg-[#29170e] border border-amber-900/30 text-amber-400 hover:bg-[#382013]';
                } else {
                    cell.className += 'bg-[#240e0e] border border-red-900/30 text-red-400 hover:bg-[#321313]';
                }

                const dayNum = document.createElement('span');
                dayNum.className = 'font-bold text-xs md:text-sm';
                dayNum.innerText = String(day);
                cell.appendChild(dayNum);

                const statusTag = document.createElement('span');
                if (busyPeople.length > 0) {
                    statusTag.className = 'text-[9px] truncate max-w-full text-gray-400 font-medium tracking-tight';
                    statusTag.innerText = busyPeople.join(', ');
                    cell.title = `불가능: ${busyPeople.join(', ')}`;
                    cell.setAttribute('aria-label', `${day}일, 불가능: ${busyPeople.join(', ')}`);
                } else {
                    statusTag.className = 'text-[9px] text-green-500/70 opacity-0 group-hover:opacity-100 transition-opacity font-bold';
                    statusTag.innerText = 'OK';
                    cell.setAttribute('aria-label', `${day}일, 모두 가능`);
                }
                cell.appendChild(statusTag);

                if (busyPeople.length > 0) {
                    const tooltip = document.createElement('span');
                    const columnIndex = (startDayOfWeek + day - 1) % 7;
                    const horizontalPosition = columnIndex === 0
                        ? 'left-0'
                        : columnIndex === 6
                            ? 'right-0'
                            : 'left-1/2 -translate-x-1/2';

                    tooltip.className = `pointer-events-none absolute top-full z-50 mt-2 hidden w-max max-w-[16rem] whitespace-normal rounded-lg border border-gray-700 bg-gray-950 px-3 py-2 text-[11px] font-medium leading-relaxed text-gray-100 shadow-2xl group-hover:block group-focus-visible:block ${horizontalPosition}`;
                    tooltip.innerText = `불가능: ${busyPeople.join(', ')}`;
                    cell.appendChild(tooltip);
                }

                cell.addEventListener('click', async () => {
                    if (AppState.pendingDates.has(dateString)) return;
                    AppState.pendingDates.add(dateString);
                    cell.disabled = true;
                    cell.classList.add('opacity-60', 'cursor-wait');
                    try {
                        await Database.toggleSchedule(
                            AppState.user.roomCode,
                            AppState.user.nickname,
                            dateString
                        );
                        await fetchAndRenderAll({ silent: true });
                    } catch (error) {
                        console.error('일정 변경 실패:', error);
                        showToast('일정 변경에 실패했습니다.', 'error');
                    } finally {
                        AppState.pendingDates.delete(dateString);
                    }
                });

                grid.appendChild(cell);
            }

            document.getElementById('calendar-year-month').innerText = getYearMonthString(year, month);
        }

        function renderParticipants() {
            const listContainer = document.getElementById('participants-list');
            listContainer.innerHTML = '';

            const allUsers = [...new Set(AppState.loadedSchedules.map((schedule) => schedule.user_name))];
            if (!allUsers.includes(AppState.user.nickname)) {
                allUsers.push(AppState.user.nickname);
            }

            allUsers.sort((a, b) => {
                if (a === AppState.user.nickname) return -1;
                if (b === AppState.user.nickname) return 1;
                return a.localeCompare(b, 'ko');
            });

            allUsers.forEach((user) => {
                const isMe = user === AppState.user.nickname;
                const unavailableDays = new Set(
                    AppState.loadedSchedules
                        .filter((schedule) => schedule.user_name === user)
                        .map((schedule) => schedule.impossible_date)
                ).size;

                const row = document.createElement('div');
                row.className = 'flex justify-between items-center bg-gray-900 border border-gray-800/80 p-2.5 rounded-xl';

                const nameLabel = document.createElement('span');
                nameLabel.className = `text-xs font-semibold ${isMe ? 'text-indigo-400' : 'text-gray-300'}`;
                nameLabel.innerText = isMe ? `${user} (나)` : user;

                const countBadge = document.createElement('span');
                countBadge.className = 'bg-gray-800 border border-gray-700 text-gray-400 font-semibold text-[10px] px-2 py-0.5 rounded-md';
                countBadge.innerText = `안됨 ${unavailableDays}일`;

                row.append(nameLabel, countBadge);
                listContainer.appendChild(row);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedNick = localStorage.getItem('inverse_calendar_nick');
            if (savedNick) {
                document.getElementById('input-nickname').value = savedNick;
            }

            document.getElementById('tab-join').addEventListener('click', (event) => {
                document.getElementById('form-join').classList.remove('hidden');
                document.getElementById('form-create').classList.add('hidden');
                event.currentTarget.className = 'py-2.5 text-sm font-semibold rounded-lg bg-gray-800 text-white shadow-sm transition';
                document.getElementById('tab-create').className = 'py-2.5 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition';
            });

            document.getElementById('tab-create').addEventListener('click', (event) => {
                document.getElementById('form-create').classList.remove('hidden');
                document.getElementById('form-join').classList.add('hidden');
                event.currentTarget.className = 'py-2.5 text-sm font-semibold rounded-lg bg-gray-800 text-white shadow-sm transition';
                document.getElementById('tab-join').className = 'py-2.5 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition';
            });

            document.getElementById('input-room-code').addEventListener('input', (event) => {
                event.target.value = event.target.value
                    .toUpperCase()
                    .replace(/[^A-HJ-NP-Z2-9]/g, '');
            });

            document.getElementById('btn-submit-join').addEventListener('click', async () => {
                const nickname = document.getElementById('input-nickname').value.trim();
                const roomCode = document.getElementById('input-room-code').value.trim().toUpperCase();

                if (!nickname) {
                    showToast('닉네임을 먼저 입력해 주세요.', 'warning');
                    return;
                }
                if (roomCode.length !== 6) {
                    showToast('유효한 6자리 초대 코드를 입력해 주세요.', 'warning');
                    return;
                }

                try {
                    const room = await Database.getRoom(roomCode);
                    if (!room) {
                        showToast('해당 초대 코드의 방을 찾을 수 없습니다.', 'error');
                        return;
                    }
                    await enterRoom(room, nickname);
                    showToast(`'${room.room_name}' 방에 참가했습니다!`, 'check_circle');
                } catch (error) {
                    console.error('방 입장 실패:', error);
                    showToast('방 정보를 확인하지 못했습니다.', 'error');
                }
            });

            document.getElementById('btn-submit-create').addEventListener('click', async () => {
                const nickname = document.getElementById('input-nickname').value.trim();
                const roomName = document.getElementById('input-room-name').value.trim();

                if (!nickname) {
                    showToast('닉네임을 먼저 입력해 주세요.', 'warning');
                    return;
                }
                if (!roomName) {
                    showToast('모임 이름을 적어주세요.', 'warning');
                    return;
                }

                try {
                    const room = await Database.createRoom(roomName);
                    await enterRoom(room, nickname);
                    showToast(`초대 코드 ${room.room_code} 방을 개설했습니다!`, 'check_circle');
                } catch (error) {
                    console.error('방 생성 실패:', error);
                    showToast('방 생성에 실패했습니다. DB 정책을 확인해 주세요.', 'error');
                }
            });

            document.getElementById('copy-code-container').addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(AppState.user.roomCode);
                    showToast('초대 코드가 복사되었습니다!', 'content_paste');
                } catch (error) {
                    showToast(`초대 코드: ${AppState.user.roomCode}`, 'info');
                }
            });

            document.getElementById('btn-refresh-calendar').addEventListener('click', async () => {
                await fetchAndRenderAll();
                if (!document.hidden && !AppState.realtimeChannel) {
                    await subscribeToRoom();
                }
                showToast('일정을 새로고침했습니다.', 'refresh');
            });

            document.getElementById('btn-prev-month').addEventListener('click', () => {
                if (AppState.calendar.month === 0) {
                    AppState.calendar.month = 11;
                    AppState.calendar.year -= 1;
                } else {
                    AppState.calendar.month -= 1;
                }
                renderCalendar();
            });

            document.getElementById('btn-next-month').addEventListener('click', () => {
                if (AppState.calendar.month === 11) {
                    AppState.calendar.month = 0;
                    AppState.calendar.year += 1;
                } else {
                    AppState.calendar.month += 1;
                }
                renderCalendar();
            });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    scheduleRealtimePause();
                } else {
                    resumeRealtime().catch((error) => {
                        console.error('실시간 연결 재개 실패:', error);
                        setRealtimeStatus('CHANNEL_ERROR');
                    });
                }
            });

            window.addEventListener('pagehide', () => {
                clearRealtimePauseTimer();
                if (AppState.realtimeChannel) {
                    supabaseClient.removeChannel(AppState.realtimeChannel);
                    AppState.realtimeChannel = null;
                }
            });
        });
    </script>
</body>
</html>
